# How AWS Amplify Hosting builds the site. Without this file Amplify guesses, and its
# default Node can be older than Next 16 needs (20.9 or newer).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The version in .nvmrc
        - nvm install
        - nvm use
        - node --version
        # Exactly what yarn.lock says; fails here, clearly, if the lockfile is out of date.
        # Its postinstall copies the map's worker into public/vendor, which isn't committed.
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
# No backend phase: the data lives in Supabase and there is no amplify/ folder, so
# `ampx pipeline-deploy` has nothing to deploy and fails the build.